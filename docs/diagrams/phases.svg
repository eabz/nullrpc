<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<style>
.bg{fill:#ffffff}.lb{fill:#ffffff}
.h{fill:#1f2328;font-weight:600}.t{fill:#1f2328}.s{fill:#59636e;font-size:12px}
.ln{stroke:#818b98;stroke-width:1.5;fill:none}.ln.d{stroke-dasharray:5 4}.ah{fill:#818b98}
.al{fill:#59636e;font-size:12px}
.n{fill:#f6f8fa;stroke:#d1d9e0}.ext{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 3}
.host{fill:#ddf4ff;stroke:#54aeff}.cf{fill:#fff1e5;stroke:#fb8f44}
.st{fill:#dafbe1;stroke:#4ac26b}.warn{fill:#ffebe9;stroke:#ff8182}
.grp{fill:none;stroke:#d1d9e0;stroke-dasharray:6 4}.gl{fill:#59636e;font-size:12px;font-weight:600}
@media (prefers-color-scheme: dark){
.bg,.lb{fill:#0d1117}
.h,.t{fill:#e6edf3}.s,.al,.gl{fill:#9198a1}
.ln{stroke:#656c76}.ah{fill:#656c76}
.n,.ext{fill:#151b23;stroke:#3d444d}
.host{fill:#0c2d6b;stroke:#1f6feb}.cf{fill:#3b1d0a;stroke:#db6d28}
.st{fill:#04260f;stroke:#2ea043}.warn{fill:#3c0d0d;stroke:#f85149}
.grp{stroke:#3d444d}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="1000" height="230" rx="12"/>
<path class="ln" d="M310,115.0 L360,115.0" marker-end="url(#ah)"/>
<path class="ln" d="M640,115.0 L690,115.0" marker-end="url(#ah)"/>
<rect class="n" x="30" y="40" width="280" height="150" rx="8"/><text class="h" x="170.0" y="85.5" text-anchor="middle">1 · Backfill</text><text class="s" x="170.0" y="102.5" text-anchor="middle">once, hourly machine</text><text class="s" x="170.0" y="119.5" text-anchor="middle">archive snapshot → R2</text><text class="s" x="170.0" y="136.5" text-anchor="middle">genesis … B</text><text class="s" x="170.0" y="153.5" text-anchor="middle">done when HEAD = B</text>
<rect class="n" x="360" y="40" width="280" height="150" rx="8"/><text class="h" x="500.0" y="85.5" text-anchor="middle">2 · Prune</text><text class="s" x="500.0" y="102.5" text-anchor="middle">once</text><text class="s" x="500.0" y="119.5" text-anchor="middle">pruned node from a snapshot</text><text class="s" x="500.0" y="136.5" text-anchor="middle">check the state root at B</text><text class="s" x="500.0" y="153.5" text-anchor="middle">delete the archive disk</text>
<rect class="n" x="690" y="40" width="280" height="150" rx="8"/><text class="h" x="830.0" y="85.5" text-anchor="middle">3 · Live</text><text class="s" x="830.0" y="102.5" text-anchor="middle">forever, monthly machine</text><text class="s" x="830.0" y="119.5" text-anchor="middle">node → daemon → DOs</text><text class="s" x="830.0" y="136.5" text-anchor="middle">promote finalized blocks to R2</text><text class="s" x="830.0" y="153.5" text-anchor="middle">runs for as long as the chain is served</text>
</svg>
