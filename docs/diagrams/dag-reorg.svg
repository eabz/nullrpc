<rect class="n" x="150.0" y="30" width="300" height="54" rx="8"/><text class="h" x="300.0" y="53.0" text-anchor="middle">G1 · Parent mismatch</text><text class="s" x="300.0" y="70.0" text-anchor="middle">at block n</text>
<rect class="host" x="150.0" y="120" width="300" height="54" rx="8"/><text class="h" x="300.0" y="143.0" text-anchor="middle">G2 · Find ancestor A</text><text class="s" x="300.0" y="160.0" text-anchor="middle">walk back on the node</text>
<rect class="warn" x="540.0" y="120" width="200" height="54" rx="8"/><text class="h" x="640.0" y="143.0" text-anchor="middle">Stop and alert</text><text class="s" x="640.0" y="160.0" text-anchor="middle">A &lt; F</text>
<rect class="cf" x="150.0" y="210" width="300" height="54" rx="8"/><text class="h" x="300.0" y="233.0" text-anchor="middle">G3 · Fence</text><text class="s" x="300.0" y="250.0" text-anchor="middle">fence(removed) on every shard</text>
<rect class="cf" x="150.0" y="300" width="300" height="54" rx="8"/><text class="h" x="300.0" y="323.0" text-anchor="middle">G4 · Lower head</text><text class="s" x="300.0" y="340.0" text-anchor="middle">ChainDO head = A</text>
<rect class="cf" x="150.0" y="390" width="300" height="54" rx="8"/><text class="h" x="300.0" y="413.0" text-anchor="middle">G5 · Truncate</text><text class="s" x="300.0" y="430.0" text-anchor="middle">truncateAbove(A), shards and ChainDO</text>
<rect class="host" x="150.0" y="480" width="300" height="54" rx="8"/><text class="h" x="300.0" y="503.0" text-anchor="middle">G6 · Spool</text><text class="s" x="300.0" y="520.0" text-anchor="middle">removed blocks to orphaned/</text>
<rect class="n" x="150.0" y="570" width="300" height="54" rx="8"/><text class="h" x="300.0" y="593.0" text-anchor="middle">G7 · Apply new branch</text><text class="s" x="300.0" y="610.0" text-anchor="middle">block DAG, A+1 … new head</text>
