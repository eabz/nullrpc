<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<style>
.bg{fill:#ffffff}.lb{fill:#ffffff}
.h{fill:#1f2328;font-weight:600}.t{fill:#1f2328}.s{fill:#59636e;font-size:12px}
.ln{stroke:#818b98;stroke-width:1.5;fill:none}.ln.d{stroke-dasharray:5 4}.ah{fill:#818b98}
.al{fill:#59636e;font-size:12px}
.n{fill:#f6f8fa;stroke:#d1d9e0}.ext{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 3}
.host{fill:#ddf4ff;stroke:#54aeff}.cf{fill:#fff1e5;stroke:#fb8f44}
.st{fill:#dafbe1;stroke:#4ac26b}.warn{fill:#ffebe9;stroke:#ff8182}
.grp{fill:none;stroke:#d1d9e0;stroke-dasharray:6 4}.gl{fill:#59636e;font-size:12px;font-weight:600}
@media (prefers-color-scheme: dark){
.bg,.lb{fill:#0d1117}
.h,.t{fill:#e6edf3}.s,.al,.gl{fill:#9198a1}
.ln{stroke:#656c76}.ah{fill:#656c76}
.n,.ext{fill:#151b23;stroke:#3d444d}
.host{fill:#0c2d6b;stroke:#1f6feb}.cf{fill:#3b1d0a;stroke:#db6d28}
.st{fill:#04260f;stroke:#2ea043}.warn{fill:#3c0d0d;stroke:#f85149}
.grp{stroke:#3d444d}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="960" height="210" rx="12"/>
<path class="ln" d="M60,52 L60,118"/>
<path class="ln" d="M600,52 L600,118"/>
<path class="ln" d="M760,52 L760,118"/>
<path class="ln" d="M900,52 L900,118"/>
<rect class="st" x="60" y="70" width="540" height="30" rx="8"/><text class="h" x="330.0" y="89.5" text-anchor="middle">R2 · immutable generations</text>
<rect class="cf" x="600" y="70" width="300" height="30" rx="8"/><text class="h" x="750.0" y="89.5" text-anchor="middle">ChainDO + StateShards</text>
<rect class="host" x="480" y="130" width="420" height="22" rx="8"/><text class="h" x="690.0" y="145.5" text-anchor="middle"></text>
<text class="s" x="480" y="172" text-anchor="start">Node: tip state and history within its prune distance</text>
<text class="h" x="60" y="30" text-anchor="middle">genesis</text>
<text class="h" x="600" y="30" text-anchor="middle">P</text>
<text class="s" x="600" y="45" text-anchor="middle">last promoted</text>
<text class="h" x="760" y="30" text-anchor="middle">F</text>
<text class="s" x="760" y="45" text-anchor="middle">finalized</text>
<text class="h" x="900" y="30" text-anchor="middle">head</text>
<text class="s" x="830.0" y="195" text-anchor="middle">reorgs happen only above F</text>
</svg>
