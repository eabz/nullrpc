<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<style>
.bg{fill:#ffffff}.lb{fill:#ffffff}
.h{fill:#1f2328;font-weight:600}.t{fill:#1f2328}.s{fill:#59636e;font-size:12px}
.ln{stroke:#818b98;stroke-width:1.5;fill:none}.ln.d{stroke-dasharray:5 4}.ah{fill:#818b98}
.al{fill:#59636e;font-size:12px}
.n{fill:#f6f8fa;stroke:#d1d9e0}.ext{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 3}
.host{fill:#ddf4ff;stroke:#54aeff}.cf{fill:#fff1e5;stroke:#fb8f44}
.st{fill:#dafbe1;stroke:#4ac26b}.warn{fill:#ffebe9;stroke:#ff8182}
.grp{fill:none;stroke:#d1d9e0;stroke-dasharray:6 4}.gl{fill:#59636e;font-size:12px;font-weight:600}
@media (prefers-color-scheme: dark){
.bg,.lb{fill:#0d1117}
.h,.t{fill:#e6edf3}.s,.al,.gl{fill:#9198a1}
.ln{stroke:#656c76}.ah{fill:#656c76}
.n,.ext{fill:#151b23;stroke:#3d444d}
.host{fill:#0c2d6b;stroke:#1f6feb}.cf{fill:#3b1d0a;stroke:#db6d28}
.st{fill:#04260f;stroke:#2ea043}.warn{fill:#3c0d0d;stroke:#f85149}
.grp{stroke:#3d444d}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="900" height="400" rx="12"/>
<path class="ln" d="M450.0,70 L450.0,110" marker-end="url(#ah)"/>
<path class="ln" d="M330,135.0 L170.0,135.0 L170.0,210" marker-end="url(#ah)"/>
<path class="ln" d="M570,135.0 L730.0,135.0 L730.0,210" marker-end="url(#ah)"/>
<path class="ln" d="M600,252.0 L590,252.0 L590,348.0 L580,348.0" marker-end="url(#ah)"/>
<path class="ln" d="M730.0,266 L730.0,320" marker-end="url(#ah)"/>
<rect class="n" x="330" y="20" width="240" height="50" rx="8"/><text class="h" x="450.0" y="49.5" text-anchor="middle">State read (key, n)</text>
<rect class="n" x="330" y="110" width="240" height="50" rx="8"/><text class="h" x="450.0" y="139.5" text-anchor="middle">n ≤ P ?</text>
<rect class="st" x="40" y="210" width="260" height="56" rx="8"/><text class="h" x="170.0" y="234.0" text-anchor="middle">R2 history at n</text><text class="s" x="170.0" y="251.0" text-anchor="middle">2 reads in the newest layer with the key</text>
<rect class="cf" x="600" y="210" width="260" height="56" rx="8"/><text class="h" x="730.0" y="234.0" text-anchor="middle">StateShard.getPinned</text><text class="s" x="730.0" y="251.0" text-anchor="middle">row in P+1 … n → value</text>
<rect class="st" x="320" y="320" width="260" height="56" rx="8"/><text class="h" x="450.0" y="344.0" text-anchor="middle">R2 history at P</text><text class="s" x="450.0" y="361.0" text-anchor="middle">the key is unchanged since P</text>
<rect class="warn" x="600" y="320" width="260" height="56" rx="8"/><text class="h" x="730.0" y="344.0" text-anchor="middle">Refresh head, retry</text><text class="s" x="730.0" y="361.0" text-anchor="middle">the pin was reorged away</text>
<rect class="lb" x="154.92" y="163.0" width="30.160000000000004" height="19" rx="3"/><text class="al" x="170.0" y="176.5" text-anchor="middle">yes</text>
<rect class="lb" x="718.28" y="163.0" width="23.44" height="19" rx="3"/><text class="al" x="730.0" y="176.5" text-anchor="middle">no</text>
<rect class="lb" x="564.84" y="290.5" width="50.32000000000001" height="19" rx="3"/><text class="al" x="590" y="304.0" text-anchor="middle">no row</text>
<rect class="lb" x="708.2" y="283.5" width="43.6" height="19" rx="3"/><text class="al" x="730.0" y="297.0" text-anchor="middle">stale</text>
</svg>
