[package]
name = "nullrpc-frames"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Archive frame decoding for the RPC Worker, compiled to WebAssembly: zstd decompression (the C library behind zstd-safe) and eth_getLogs extraction from block records"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Decompression only: no legacy formats, no dictionary builder. zstd-sys ships the libc shim
# that lets the C library build for wasm32-unknown-unknown.
zstd-safe = { version = "7.2.4", default-features = false, features = ["std"] }
sha3 = { version = "0.10", default-features = false }

[profile.release]
# Speed, not size: the module is about 120 KB either way, and the decoders are on every archive read.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
